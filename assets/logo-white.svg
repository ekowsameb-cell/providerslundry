<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 22 456 126" width="456" height="126">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00bcd4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00838f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00bcd4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4caf50;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- ===== LOGO ICON (Left) ===== -->
  <g transform="translate(30, 30)">
    <!-- Teal rounded square background -->
    <rect x="0" y="0" width="110" height="110" rx="24" ry="24" fill="url(#grad1)" />
    
    <!-- Bubble 1 -->
    <circle cx="35" cy="35" r="10" fill="rgba(255,255,255,0.3)" />
    <!-- Bubble 2 -->
    <circle cx="70" cy="50" r="7" fill="rgba(255,255,255,0.25)" />
    
    <!-- Stylized "P" letter -->
    <text x="55" y="77" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="bold" fill="#ffffff" text-anchor="middle">P</text>
    
    <!-- Accent dot (green instead of teal for variety) -->
    <circle cx="95" cy="15" r="8" fill="#4caf50" />
  </g>

  <!-- ===== COMPANY NAME (Right) ===== -->
  <g transform="translate(165, 50)">
    <!-- Main brand name -->
    <text x="0" y="0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="1">Providers</text>
    
    <!-- Divider line -->
    <rect x="0" y="14" width="280" height="3" rx="1.5" fill="url(#grad2)" />
    
    <!-- Subtitle -->
    <text x="0" y="45" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#7fdbe3" letter-spacing="3">LAUNDRY</text>
    
    <!-- Tagline -->
    <text x="0" y="68" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#9fbcc0" letter-spacing="1">Professional Dry Cleaning &amp; Laundry Services</text>
  </g>
</svg>